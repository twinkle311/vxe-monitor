name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja

      - name: Build (CMake + MinGW)
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Smoke check (exports built)
        shell: pwsh
        run: |
          if (!(Test-Path build/vxe-monitor.exe) -or !(Test-Path build/probe.exe)) {
            Write-Error "Build output missing"; exit 1
          }
          Get-ChildItem build/*.exe | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vxe-monitor-win64
          path: |
            build/vxe-monitor.exe
            build/probe.exe
